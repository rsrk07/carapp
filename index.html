<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Car360 — 3D Car Configurator</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
</head>
<body>

  <!-- ═══════════════════════════════════════════
       LOADING SCREEN
  ═══════════════════════════════════════════ -->
  <div id="loading-screen">
    <div class="loader-inner">
      <div class="loader-logo">Car360</div>
      <div class="loader-bar-track">
        <div class="loader-bar" id="loader-bar"></div>
      </div>
      <div class="loader-text" id="loader-text">Initializing Studio…</div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       MAIN APP
  ═══════════════════════════════════════════ -->
  <div id="app" class="hidden">

    <!-- ── TOP NAV ── -->
    <header class="topnav">
      <div class="topnav-logo">Car360</div>
      <nav class="topnav-steps">
        <span class="step active" data-step="exterior">01 — Exterior</span>
        <span class="step" data-step="interior">02 — Interior</span>
        <span class="step" data-step="accessories">03 — Accessories</span>
      </nav>
      <div class="topnav-actions">
        <button class="btn-ghost" id="btn-save">Save Config</button>
        <button class="btn-primary" id="btn-order">Order Now</button>
      </div>
    </header>

    <!-- ── CANVAS WRAPPER ── -->
    <main class="canvas-wrapper">
      <canvas id="three-canvas"></canvas>

      <div class="spotlight-ring"></div>

      <!-- Car label overlay -->
      <div class="car-label">
        <div class="car-label-name" id="label-name">Opel GT</div>
        <div class="car-label-sub" id="label-sub">640 hp · 0–100 in 2.9s · AWD</div>
      </div>

      <!-- View toggle -->
      <div class="view-toggle">
        <button class="vtoggle active" id="btn-exterior">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
          Exterior
        </button>
        <button class="vtoggle" id="btn-interior">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M3 9h6"/></svg>
          Interior
        </button>
      </div>

      <!-- Auto rotate toggle -->
      <div class="platform-toggle">
        <button class="ptoggle active" id="btn-rotate">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a9 9 0 1 1-6.22-8.56"/><polyline points="21 3 21 9 15 9"/></svg>
          Auto Rotate
        </button>
      </div>

      <!-- Door control -->
      <div class="door-control">
        <button class="door-btn" id="btn-doors">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="2" width="18" height="20" rx="2"/><circle cx="16" cy="12" r="1"/></svg>
          Open Doors
        </button>
      </div>

      <!-- Door status indicator — shows which doors were found in the model -->
      <div class="door-status" id="door-status" style="display:none;"></div>
    </main>

    <!-- ── LEFT SIDEBAR ── -->
    <aside class="sidebar-left">
      <div class="sidebar-section active" data-section="colors">
        <div class="sidebar-label">Paint</div>
        <div class="color-grid" id="color-grid"></div>
      </div>

      <div class="sidebar-divider"></div>

      <div class="sidebar-section" data-section="wheels">
        <div class="sidebar-label">Wheels</div>
        <div class="wheel-options" id="wheel-options"></div>
      </div>

      <div class="sidebar-divider"></div>

      <div class="sidebar-section" data-section="finish">
        <div class="sidebar-label">Finish</div>
        <div class="finish-options" id="finish-options">
          <button class="finish-btn active" data-finish="metallic">Metallic</button>
          <button class="finish-btn" data-finish="matte">Matte</button>
          <button class="finish-btn" data-finish="gloss">Gloss</button>
          <button class="finish-btn" data-finish="satin">Satin</button>
        </div>
      </div>
    </aside>

    <!-- ── RIGHT SIDEBAR ── -->
    <aside class="sidebar-right">
      <div class="sidebar-label">Configurations</div>
      <div class="configs-list" id="configs-list"></div>
      <button class="btn-add-config" id="btn-add-config">+ Save Current</button>

      <div class="sidebar-divider"></div>

      <div class="sidebar-label">Specs</div>
      <div class="specs-list" id="specs-list"></div>
    </aside>

    <!-- ── BOTTOM BAR ── -->
    <div class="bottom-bar">
      <div class="bottom-colors" id="bottom-colors"></div>
      <div class="bottom-actions">
        <button class="bottom-icon-btn" id="btn-screenshot" title="Screenshot">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="4"/></svg>
        </button>
        <button class="bottom-icon-btn" id="btn-fullscreen" title="Fullscreen">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
      </div>
    </div>

  </div><!-- /#app -->

  <div class="toast" id="toast"></div>

  <!-- ══════════════════════════════════════════
       SCRIPTS — ORDER IS CRITICAL:
       1. Three.js core
       2. GLTFLoader (needs Three.js)
       3. DRACOLoader (needs Three.js)
       4. script.js (needs all three above)
       All versions must match: r128
  ══════════════════════════════════════════ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
  <script src="script.js"></script>

</body>
</html>
